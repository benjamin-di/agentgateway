name: CI
on:
  push:
    branches: [fleet-candidate, fleet]
  pull_request:
    branches: [fleet-candidate, fleet]
permissions:
  contents: read
  actions: read
concurrency:
  group: fleet-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: make lint
      - run: make test
      - uses: astral-sh/setup-uv@v8.3.2
      - run: cargo build -p agentgateway-app
      - run: uv run --script tools/test-jwt-refresh.py --binary target/debug/agentgateway
      - run: make generate-schema && git diff --exit-code -- schema
