name: Fleet candidate
on:
  push:
    branches: [fleet-candidate, fleet]
    tags: ['v*-fleet.*']
permissions:
  contents: read
concurrency:
  group: fleet-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: make lint
      - run: make test
      - run: make generate-schema && git diff --exit-code -- schema
  image:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate from reviewed source
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="development-${GITHUB_SHA:0:12}"
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"; fi
          docker buildx build --push --platform linux/amd64 \
            --build-arg VERSION="$version" --build-arg GIT_REVISION="$GITHUB_SHA" \
            --build-arg CARGO_BUILD_JOBS=2 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --provenance=mode=max --sbom=true --metadata-file metadata.json \
            -t "ghcr.io/$GITHUB_REPOSITORY:candidate-$GITHUB_RUN_ID" .
          digest="$(jq -er '."containerimage.digest"' metadata.json)"
          echo "IMAGE=ghcr.io/$GITHUB_REPOSITORY@$digest" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Smoke exact image digest
        run: |
          set -euo pipefail
          docker run --rm --network none "$IMAGE" --version > version.json
          jq -e --arg version "$VERSION" --arg revision "$GITHUB_SHA" \
            '.version == $version and .git_revision == $revision' version.json
          docker run --rm --network none "$IMAGE" --help >/dev/null
      - name: Promote qualified release
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          target="ghcr.io/$GITHUB_REPOSITORY:$VERSION"
          if docker buildx imagetools inspect "$target" >/dev/null 2>&1; then
            echo 'Refusing to replace a published release' >&2
            exit 1
          fi
          docker buildx imagetools create --prefer-index=false --tag "$target" "$IMAGE"
          echo "Qualified release: $target@${IMAGE##*@}" >> "$GITHUB_STEP_SUMMARY"
